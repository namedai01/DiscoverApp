services:
  api:
    build: .
    environment:
      APP_ENV: dev
      AUTH_MODE: fake
      FIREBASE_PROJECT_ID: memopin-app
      STORAGE_BUCKET: memopin-app.firebasestorage.app
      DATABASE_URL: postgres://memopin:memopin@db:5432/memopin?sslmode=disable
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: memopin
      POSTGRES_PASSWORD: memopin
      POSTGRES_DB: memopin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memopin -d memopin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
